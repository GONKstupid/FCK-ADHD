<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- FCK-ADHD dot-matrix glyph -->
  <rect width="32" height="32" rx="6" fill="#1b1b1a"/>
  <g fill="#f5f3ec">
    <circle cx="8"  cy="8"  r="2.6"/>
    <circle cx="16" cy="8"  r="2.6"/>
    <circle cx="24" cy="8"  r="2.6"/>
    <circle cx="8"  cy="16" r="2.6"/>
    <circle cx="24" cy="16" r="2.6"/>
    <circle cx="8"  cy="24" r="2.6"/>
    <circle cx="16" cy="24" r="2.6"/>
    <circle cx="24" cy="24" r="2.6"/>
  </g>
  <!-- center dot = the alarm signal -->
  <circle cx="16" cy="16" r="3.4" fill="#ff3b30"/>
</svg>
